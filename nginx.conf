events{}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    server_name localhost;
    index index.html;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
    location /static/ {
      alias /usr/share/nginx/html/static/;
    }
  }
}
